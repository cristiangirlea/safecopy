name: Fuzz, weekly

on:
  # Mondays, 03:17 UTC: half an hour per target, where a pull request gets a minute.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One at a time: a second would start from the same corpus.
concurrency:
  group: fuzz-weekly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The same nightly as ci.yml's fuzz job; change both together.
  FUZZ_NIGHTLY: nightly-2026-11-15

jobs:
  fuzz:
    name: fuzz, 30 minutes (${{ matrix.target }})
    # This repository's main alone: never a fork's minutes, never another branch's corpus.
    if: github.repository == 'cristiangirlea/safecopy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [smoke, names, manifest, journal, framing, resume_handshake, journal_log, bundle_table]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # Built from source at a pinned version: no prebuilt binary nobody checked.
      - run: cargo install cargo-fuzz@0.13.2 --locked
      # The newest corpus main has: its own of last week, or a later one of a merge.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # libFuzzer fails the step on a crash and leaves the input in fuzz/artifacts.
      - name: Fuzz from the corpus and the seeds
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +${{ env.FUZZ_NIGHTLY }} fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=1800 -rss_limit_mb=2048
      # Only the inputs that reach something the others do not are kept, so
      # the cache stays small however many runs added to it.
      - name: Minimise the corpus
        run: cargo +${{ env.FUZZ_NIGHTLY }} fuzz cmin ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -rss_limit_mb=2048
      # After a crash too: what was found before it is still worth keeping.
      - name: Save the corpus
        if: ${{ !cancelled() && hashFiles(format('fuzz/corpus/{0}/**', matrix.target)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The failed run is the notice; the input is here for two weeks.
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

# cargo-deny: run `cargo deny check` (CI runs it on every push and pull request).

[graph]
all-features = true

[advisories]
# Version 2 denies every vulnerability, unmaintained and unsound advisory by default.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only, so anyone can use safecopy under MIT.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9
# Not every allowed licence is in use yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

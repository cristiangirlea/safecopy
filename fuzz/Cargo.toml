[package]
name = "safecopy-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Fuzz targets for safecopy's parsers (cargo-fuzz, nightly)."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
safecopy = { path = "../crates/safecopy" }

# Its own workspace: cargo-fuzz needs nightly, the library stays on stable.
[workspace]
members = ["."]

[[bin]]
name = "smoke"
path = "fuzz_targets/smoke.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal"
path = "fuzz_targets/journal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resume_handshake"
path = "fuzz_targets/resume_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_log"
path = "fuzz_targets/journal_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_table"
path = "fuzz_targets/bundle_table.rs"
test = false
doc = false
bench = false

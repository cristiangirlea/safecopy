[package]
name = "safecopy-resume"
description = "Resume records and the checks that let an interrupted transfer continue where it stopped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
safecopy-folder.workspace = true
safecopy-chunks.workspace = true
safecopy-journal.workspace = true
# SHA-256 of a record's slot and the transfer key's random bytes, as safecopy-chunks uses it.
ring = { version = "0.17.14", default-features = false }
tokio = { version = "1.53.3", features = ["fs", "io-util"] }

# The fuzz target's own runtime, in the fuzzer's build alone.
[target.'cfg(fuzzing)'.dependencies]
tokio = { version = "1.53.3", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_Storage_FileSystem"]

[dev-dependencies]
safecopy-manifest.workspace = true
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "io-util", "fs"] }

# A junction made in tests with no other program run: the control call for it.
[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"]

[lints]
workspace = true

[package]
name = "safecopy-folder"
description = "Writing into a held folder: no links followed, nothing replaced, publish under a new name."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
safecopy-names.workspace = true
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
]

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
